spring:
  application:
    name: billim-api
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:billim_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true # 쿼리 가독성 향상
        show_sql: true
        default_batch_fetch_size: 100 # N+1 문제 완화의 기본 조치

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Spring Batch
  batch:
    job:
      enabled: false # 개발 환경에서 Job 자동 실행 비활성화

jwt:
  # WARNING: The default secret is for local development ONLY.
  # In production, you MUST set the JWT_SECRET environment variable to a unique, strong secret.
  secret: ${JWT_SECRET:billim-local-dev-secret-key-must-be-at-least-32-chars-long}
  access-token-validity: 3600000 # 1시간
  refresh-token-validity: 1209600000 # 14일
